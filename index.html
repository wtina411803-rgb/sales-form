<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業務案件登錄系統</title>
    <style>
        :root { --primary-color: #2563eb; --bg-color: #f8fafc; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); padding: 20px; color: #334155; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h2 { text-align: center; color: #1e293b; margin-bottom: 24px; }
        .section-title { background: #f1f5f9; padding: 8px 12px; border-left: 4px solid var(--primary-color); font-weight: bold; margin: 20px 0 12px 0; }
        .form-group { margin-bottom: 16px; }
        .label-title { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #475569; }
        .input-style { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .fee-row { display: flex; align-items: center; gap: 12px; }
        .tax-check { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 0.9rem; cursor: pointer; }
        .tax-check input { width: 18px; height: 18px; cursor: pointer; }
        button { width: 100%; background: var(--primary-color); color: white; padding: 12px; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>業務案件登錄系統</h2>
    <form id="salesForm">
        
        <div class="section-title">一、基本資料</div>
        <div class="form-group">
            <label class="label-title">業務人員</label>
            <input type="text" name="sales_person" class="input-style" placeholder="請輸入姓名" required>
        </div>
        <div class="form-group">
            <label class="label-title">客戶名稱 (公司全銜)</label>
            <input type="text" name="client_name" class="input-style" placeholder="請輸入客戶名稱" required>
        </div>

        <div class="section-title">二、客戶來源統計</div>
        <div class="form-group">
            <label class="label-title">介紹人員 (可選或手動輸入)</label>
            <input list="referrer_list" name="referrer" class="input-style" placeholder="點擊選擇或直接輸入姓名">
            <datalist id="referrer_list">
                <option value="BNI"><option value="網路或電話"><option value="客戶介紹"><option value="會計師引入"><option value="裕民引入"><option value="農會介紹"><option value="其他事務所轉介">
            </datalist>
        </div>

        <div class="section-title">三、委任內容及報價</div>
        <div class="form-group">
            <label class="label-title">月費 (NT$)</label>
            <div class="fee-row">
                <input type="number" name="fee_monthly" class="input-style" placeholder="請輸入金額">
                <label class="tax-check"><input type="checkbox" name="tax_monthly">含稅</label>
            </div>
        </div>

        <div class="section-title">四、簽證服務費</div>
        <div class="form-group">
            <label class="label-title">稅務簽證服務費 (NT$)</label>
            <div class="fee-row">
                <input type="number" name="fee_audit_tax" class="input-style" placeholder="請輸入金額">
                <label class="tax-check"><input type="checkbox" name="tax_audit_tax">含稅</label>
            </div>
        </div>
        <div class="form-group">
            <label class="label-title">財務簽證服務費 (NT$)</label>
            <div class="fee-row">
                <input type="number" name="fee_audit_finance" class="input-style" placeholder="請輸入金額">
                <label class="tax-check"><input type="checkbox" name="tax_audit_finance">含稅</label>
            </div>
        </div>

        <div class="section-title">五、其他服務費</div>
        <div class="form-group">
            <label class="label-title">管理帳服務費 (NT$)</label>
            <div class="fee-row">
                <input type="number" name="fee_mgmt_account" class="input-style" placeholder="請輸入金額">
                <label class="tax-check"><input type="checkbox" name="tax_mgmt_account">含稅</label>
            </div>
        </div>

        <button type="submit" id="submitBtn">提交案件資料</button>
    </form>
</div>

<script>
    const form = document.getElementById('salesForm');
    const webhookUrl = "https://eounwocsqk3vn0c.m.pipedream.net"; 

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "資料傳送中...";

        const formData = new FormData(form);
        const data = {};
        
        const taxFields = ['tax_monthly', 'tax_audit_tax', 'tax_audit_finance', 'tax_mgmt_account'];
        taxFields.forEach(field => data[field] = "");

        formData.forEach((value, key) => {
            if (key.startsWith('tax_')) {
                data[key] = "含稅";
            } else {
                data[key] = value;
            }
        });

        try {
            await fetch(webhookUrl, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data),
                headers: { 'Content-Type': 'application/json' }
            });
            alert('提交成功！資料已同步至系統。');
            form.reset();
        } catch (error) {
            alert('提交失敗，請檢查網路。');
        } finally {
            btn.disabled = false;
            btn.innerText = "提交案件資料";
        }
    });
</script>

</body>
</html>
